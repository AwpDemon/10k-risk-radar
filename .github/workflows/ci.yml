name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Unit tests (LLM and EDGAR are mocked; no network, no model server)
        run: pytest -q
      - name: Offline eval smoke test (keyword baseline on the committed gold set)
        run: python scripts/smoke_eval.py
